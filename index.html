<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Digest</title>
<style>
:root{--bg:#0b0d10;--panel:#151821;--ink:#e8eaed;--mut:#8b93a1;--acc:#5b8def;--err:#e5484d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
.card{width:min(360px,90vw);padding:32px;background:var(--panel);border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
h1{font-size:16px;margin:0 0 4px;font-weight:700}
p{margin:0 0 20px;color:var(--mut);font-size:13px}
input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #2a2f3a;
  background:#0f1218;color:var(--ink);font-size:14px;outline:none}
input:focus{border-color:var(--acc)}
button{width:100%;margin-top:10px;padding:11px 12px;border-radius:8px;border:0;
  background:var(--acc);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--err);font-size:12.5px;margin-top:10px;display:none}
.err.on{display:block}
.hint{margin-top:16px;font-size:11px;color:var(--mut);opacity:.6}
</style>
</head>

const ITER = 250000;

function b64ToBuf(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}

async function tryOpen(pw){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64ToBuf(SALT_B64), iterations:ITER, hash:"SHA-256"},
    baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plainBuf = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:b64ToBuf(IV_B64)}, key, b64ToBuf(DATA_B64));
  return new TextDecoder().decode(plainBuf);
}

  btn.disabled = true; errEl.classList.remove("on");
  try {
    const html = await tryOpen(pw);
    document.open(); document.write(html); document.close();
  } catch(e) {
    errEl.classList.add("on"); btn.disabled = false; pwEl.select();
  }
}
btn.onclick = submit;
pwEl.onkeydown = (e) => { if(e.key === "Enter") submit(); };
</script>
</body>
</html>
